[project]
name = "uk-visa-consultant"
version = "0.1.0"
description = "Human-like UK visa application consultant agent — delivery-stability-first."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "openai>=1.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pdf-inspector>=1.17.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosmtpd>=1.4",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uk_visa_consultant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
